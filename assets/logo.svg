<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" fill="none">
  <rect width="680" height="240" rx="16" fill="#0d1117"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="680" height="240" fill="url(#grid)"/>
  
  <!-- Eye/Vision icon (spatial awareness) -->
  <g transform="translate(60, 45)">
    <rect x="5" y="5" width="110" height="110" rx="14" fill="#1a2332" stroke="#f778ba" stroke-width="2.5"/>
    <!-- Eye shape -->
    <path d="M20 60 Q60 25 100 60 Q60 95 20 60 Z" fill="none" stroke="#f778ba" stroke-width="2.5"/>
    <!-- Iris -->
    <circle cx="60" cy="60" r="16" fill="none" stroke="#f778ba" stroke-width="2"/>
    <!-- Pupil -->
    <circle cx="60" cy="60" r="7" fill="#f778ba"/>
    <!-- Spatial grid lines -->
    <line x1="20" y1="30" x2="100" y2="30" stroke="#f778ba" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
    <line x1="20" y1="90" x2="100" y2="90" stroke="#f778ba" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
    <line x1="35" y1="20" x2="35" y2="100" stroke="#f778ba" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
    <line x1="85" y1="20" x2="85" y2="100" stroke="#f778ba" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Title -->
  <text x="210" y="80" font-family="'Segoe UI', system-ui, sans-serif" font-size="44" fill="#e6edf3" font-weight="700" letter-spacing="-1">Prompt4SA</text>
  <text x="210" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" fill="#f778ba" font-weight="600">VQA Spatial Awareness</text>
  
  <text x="212" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#7d8590">ICCV 2025 MARS2 | InternVL3-78B | vLLM</text>
  
  <g transform="translate(212, 178)">
    <rect x="0" y="0" width="72" height="22" rx="11" fill="#1a2332" stroke="#f778ba" stroke-width="1"/>
    <text x="36" y="15" font-family="monospace" font-size="10" fill="#f778ba" text-anchor="middle">Python</text>
    <rect x="82" y="0" width="60" height="22" rx="11" fill="#1a2332" stroke="#58a6ff" stroke-width="1"/>
    <text x="112" y="15" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">vLLM</text>
    <rect x="152" y="0" width="85" height="22" rx="11" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
    <text x="194" y="15" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">MS-SWIFT</text>
    <rect x="247" y="0" width="95" height="22" rx="11" fill="#1a2332" stroke="#f0883e" stroke-width="1"/>
    <text x="294" y="15" font-family="monospace" font-size="10" fill="#f0883e" text-anchor="middle">InternVL3</text>
  </g>
</svg>
